# 只放开本作品需要的宿主机服务，其余域名仍由 SSRF 代理兜底
#
# Dify 的 HTTP Request 节点会经过 ssrf_proxy（squid），默认只允许 localhost，
# 因此容器里访问 host.docker.internal 会被 403。这里显式允许：
#   - host.docker.internal：侦探社后端（8012）与本地 Embedding（8013）
#   - api.deepseek.com：大模型（LLM 节点由 Dify 直连，不经此代理，留作兜底）
acl local_services dstdomain host.docker.internal
http_access allow local_services

acl model_api dstdomain api.deepseek.com
http_access allow model_api
