          ,\n        \"rumour_report\": \"、\".join(rumours) or \"无\",\n        \"verdict_line\": data.get(\"verdict_line\"\
          ) or \"\",\n        \"trust_text\": \"；\".join([name + \" \" + str(value) for name, value in trust.items()]) or\
          \ \"暂无\",\n    })\n    return out\n"
