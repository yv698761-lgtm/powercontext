        code: "import json\n\ndef main(body: str) -> dict:\n    out = {\"ok\": \"False\", \"error\": \"\", \"pass\": False,\
          \ \"verdict\": \"\", \"evidence\": \"\", \"expected\": \"\",\n           \"memory_id\": \"\", \"rank_title\": \"\
          \", \"rank_note\": \"\", \"canon_report\": \"\",\n           \"rumour_report\": \"\", \"verdict_line\": \"\", \"\
          trust_text\": \"\", \"seq\": 0}\n    try:\n        data = json.loads(body)\n    except Exception:\n        out[\"\
          error\"] = (body or \"\")[:400]\n        return out\n    hits = data.get(\"canon_hits\") or []\n    rumours = data.get(\"\
          rumour_hits\") or []\n    rank = data.get(\"rank\") or {}\n    trust = data.get(\"trust\") or {}\n    out.update({\n\
          \        \"ok\": \"True\",\n        \"pass\": bool(data.get(\"pass\")),\n        \"verdict\": data.get(\"verdict\"\
          ) or \"\",\n        \"evidence\": (data.get(\"evidence_fragment\") or {}).get(\"text\") or \"\",\n        \"expected\"\
          : data.get(\"expected_answer\") or \"\",\n        \"memory_id\": data.get(\"memory_id\") or \"\",\n        \"seq\"\
          : int(data.get(\"seq\") or 0),\n        \"rank_title\": rank.get(\"title\") or \"\",\n        \"rank_note\": rank.get(\"\
